# =============================================================================
# MLOps Homework 1 — Local Infrastructure
# Services: MinIO (S3 storage) + Label Studio (data annotation)
# Usage:    docker compose up -d
# =============================================================================

services:
  # ----------------------------------------------------------
  # MinIO — S3-Compatible Object Storage
  # API:     http://localhost:9000
  # Console: http://localhost:9001
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mlops-network

  # ----------------------------------------------------------
  # MinIO Init — Creates the required bucket on first run
  # This is a one-shot container that exits after setup.
  # ----------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb myminio/$${MINIO_BUCKET} --ignore-existing;
        mc anonymous set download myminio/$${MINIO_BUCKET};
        mc mb myminio/$${MLFLOW_ARTIFACTS_BUCKET} --ignore-existing;
        mc anonymous set download myminio/$${MLFLOW_ARTIFACTS_BUCKET};
        echo '✅ Buckets are ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MLFLOW_ARTIFACTS_BUCKET: ${MLFLOW_ARTIFACTS_BUCKET}
    networks:
      - mlops-network

  # ----------------------------------------------------------
  # Label Studio — Data Annotation Platform
  # UI: http://localhost:8080
  # ----------------------------------------------------------
  label-studio:
    image: heartexlabs/label-studio:${LABEL_STUDIO_VERSION}
    container_name: label-studio
    ports:
      - "8080:8080"
    environment:
      # --- Authentication ---
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD}
      # --- Local file serving ---
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/data/files
      # --- Security overrides ---
      SSRF_PROTECTION_ENABLED: "false"
      # --- Database Connection ---
      DJANGO_DB: default
      POSTGRE_NAME: ${POSTGRES_DB}
      POSTGRE_USER: ${POSTGRES_USER}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRE_PORT: 5432
      POSTGRE_HOST: postgres
    volumes:
      - label-studio-data:/label-studio/data
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - mlops-network

  # ----------------------------------------------------------
  # PostgreSQL — Label Studio Enterprise Database
  # ----------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops-network

  # ----------------------------------------------------------
  # PostgreSQL DB Init — Creates mlflow database if not exists
  # ----------------------------------------------------------
  postgres-init:
    image: postgres:15
    container_name: postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        PGPASSWORD=$${POSTGRES_PASSWORD} psql -h postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c \"CREATE DATABASE mlflow;\" || echo \"mlflow DB already exists or failed to create\";
      "
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - mlops-network

  # ----------------------------------------------------------
  # MLflow — Experiment Tracking and Model Registry
  # UI: http://localhost:5001
  # ----------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    ports:
      - "5001:5000"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: "true"
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --default-artifact-root s3://${MLFLOW_ARTIFACTS_BUCKET}/
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - mlops-network

  # ----------------------------------------------------------
  # Inference API — FastAPI serving model from MLflow registry
  # API: http://localhost:8000
  # ----------------------------------------------------------
  inference-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.serve
    container_name: inference-api
    ports:
      - "8000:8000"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_IGNORE_TLS: "true"
    volumes:
      - ../dataset:/app/dataset
    depends_on:
      mlflow:
        condition: service_started
    networks:
      - mlops-network

  # ----------------------------------------------------------
  # Prometheus — Metrics Scraper & Time-Series DB
  # UI: http://localhost:9090
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - inference-api
    networks:
      - mlops-network

  # ----------------------------------------------------------
  # Grafana — Visual Dashboard Builder
  # UI: http://localhost:3000
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mlops-network

# ----------------------------------------------------------
# Persistent Volumes
# ----------------------------------------------------------
volumes:
  minio-data:
    driver: local
  label-studio-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ----------------------------------------------------------
# Network
# ----------------------------------------------------------
networks:
  mlops-network:
    driver: bridge