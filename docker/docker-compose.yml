# =============================================================================
# MLOps Homework 1 — Local Infrastructure
# Services: MinIO (S3 storage) + Label Studio (data annotation)
# Usage:    docker compose up -d
# =============================================================================

services:
  # ----------------------------------------------------------
  # MinIO — S3-Compatible Object Storage
  # API:     http://localhost:9000
  # Console: http://localhost:9001
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mlops-network

  # ----------------------------------------------------------
  # MinIO Init — Creates the required bucket on first run
  # This is a one-shot container that exits after setup.
  # ----------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb myminio/$${MINIO_BUCKET} --ignore-existing;
        mc anonymous set download myminio/$${MINIO_BUCKET};
        echo '✅ Bucket $${MINIO_BUCKET} is ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    networks:
      - mlops-network

  # ----------------------------------------------------------
  # Label Studio — Data Annotation Platform
  # UI: http://localhost:8080
  # ----------------------------------------------------------
  label-studio:
    image: heartexlabs/label-studio:${LABEL_STUDIO_VERSION}
    container_name: label-studio
    ports:
      - "8080:8080"
    environment:
      # --- Authentication ---
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD}
      # --- Local file serving ---
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/data/files
      # --- Security overrides ---
      SSRF_PROTECTION_ENABLED: "false"
      # --- Database Connection ---
      DJANGO_DB: default
      POSTGRE_NAME: ${POSTGRES_DB}
      POSTGRE_USER: ${POSTGRES_USER}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRE_PORT: 5432
      POSTGRE_HOST: postgres
    volumes:
      - label-studio-data:/label-studio/data
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - mlops-network

  # ----------------------------------------------------------
  # PostgreSQL — Label Studio Enterprise Database
  # ----------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops-network

# ----------------------------------------------------------
# Persistent Volumes
# ----------------------------------------------------------
volumes:
  minio-data:
    driver: local
  label-studio-data:
    driver: local
  postgres-data:
    driver: local

# ----------------------------------------------------------
# Network
# ----------------------------------------------------------
networks:
  mlops-network:
    driver: bridge