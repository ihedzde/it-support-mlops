# =============================================================================
# Lint — Catch syntax and style issues early
# =============================================================================
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 🔍 Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Ruff
        run: pip install ruff

      - name: 🔍 Run Ruff linter
        run: ruff check src/ scripts/ --output-format=github
