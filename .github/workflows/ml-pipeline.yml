# =============================================================================
# CI/CD Pipeline — ML Model Training & Deployment
# Triggers: push to main, PR to main, manual dispatch, weekly schedule
# =============================================================================
name: ML Pipeline — Train & Deploy

on:
  # 1. Push to main branch triggers full pipeline
  push:
    branches: [main]

  # 2. Pull request validation (quick training only)
  pull_request:
    branches: [main]

  # 3. Manual launch from GitHub Actions UI
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of training epochs"
        required: false
        default: "1"
      quick_test:
        description: "Run quick test with sampled data (true/false)"
        required: false
        default: "true"
      promote_to_production:
        description: "Promote model to Production stage (true/false)"
        required: false
        default: "true"

  # 4. Scheduled weekly retrain — Mondays at 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ================================================================
  # Job 1: Train — Run model training and register in MLflow
  # ================================================================
  train:
    name: 🧠 Train Model
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🐳 Start infrastructure (MinIO, PostgreSQL, MLflow)
        working-directory: docker
        run: |
          docker compose up -d minio minio-init postgres postgres-init mlflow
          echo "⏳ Waiting for MLflow to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/health > /dev/null 2>&1; then
              echo "✅ MLflow is healthy"
              break
            fi
            echo "  Attempt $i/30 — waiting 10s..."
            sleep 10
          done
          # Final check
          curl -sf http://localhost:5001/health || (echo "❌ MLflow failed to start"; docker compose logs mlflow; exit 1)

      - name: 📊 Download raw dataset
        env:
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          bash scripts/download_raw.sh

      # Determine training parameters based on trigger type
      - name: ⚙️ Set training parameters
        id: params
        run: |
          # Defaults for PR — always quick test
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "epochs=1" >> $GITHUB_OUTPUT
            echo "quick_test=true" >> $GITHUB_OUTPUT
            echo "promote=false" >> $GITHUB_OUTPUT
          # Manual dispatch — use user inputs
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "epochs=${{ github.event.inputs.epochs }}" >> $GITHUB_OUTPUT
            echo "quick_test=${{ github.event.inputs.quick_test }}" >> $GITHUB_OUTPUT
            echo "promote=${{ github.event.inputs.promote_to_production }}" >> $GITHUB_OUTPUT
          # Push to main or schedule — full training
          else
            echo "epochs=1" >> $GITHUB_OUTPUT
            echo "quick_test=true" >> $GITHUB_OUTPUT
            echo "promote=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Run model training
        run: |
          python src/train.py \
            --input dataset/raw_tickets.csv \
            --epochs ${{ steps.params.outputs.epochs }} \
            --quick-test ${{ steps.params.outputs.quick_test }}

      - name: 📦 Register model in MLflow
        if: steps.params.outputs.promote == 'true'
        run: |
          python scripts/register_model.py --promote

      - name: 📦 Register model (Staging only)
        if: steps.params.outputs.promote == 'false'
        run: |
          python scripts/register_model.py

      - name: 📤 Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            metrics.json
            plots/
          retention-days: 30

      - name: 🧹 Tear down infrastructure
        if: always()
        working-directory: docker
        run: docker compose down -v

  # ================================================================
  # Job 2: Deploy — Build & deploy inference API, run smoke tests
  # ================================================================
  deploy:
    name: 🚀 Deploy Inference API
    runs-on: ubuntu-latest
    needs: train
    # Skip deployment on pull requests
    if: github.event_name != 'pull_request'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📊 Download raw dataset (needed for drift detector reference)
        env:
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          pip install kaggle
          bash scripts/download_raw.sh

      - name: 🐳 Start full stack (infra + inference API)
        working-directory: docker
        run: |
          docker compose up -d --build
          echo "⏳ Waiting for Inference API to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Inference API is healthy"
              break
            fi
            echo "  Attempt $i/30 — waiting 10s..."
            sleep 10
          done

      - name: 🧪 Smoke test — Health check
        run: |
          echo "--- Health Check ---"
          curl -sf http://localhost:8000/health | python -m json.tool

      - name: 🧪 Smoke test — Single prediction
        run: |
          echo "--- Single Prediction ---"
          RESPONSE=$(curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "My laptop screen is flickering and I cannot work"}')
          echo "$RESPONSE" | python -m json.tool

          # Verify response contains expected fields
          echo "$RESPONSE" | python -c "
          import sys, json
          r = json.load(sys.stdin)
          assert 'department' in r, 'Missing department field'
          assert 'confidence' in r, 'Missing confidence field'
          print('✅ Prediction response validated successfully')
          "

      - name: 🧪 Smoke test — Batch prediction
        run: |
          echo "--- Batch Prediction ---"
          curl -sf -X POST http://localhost:8000/predict/batch \
            -H "Content-Type: application/json" \
            -d '{"texts": ["Cannot connect to VPN", "I need a refund for my order"]}' \
            | python -m json.tool

      - name: 🎉 Deployment successful
        run: |
          echo "============================================"
          echo "✅ Deployment completed successfully!"
          echo "   - Inference API is running and serving predictions"
          echo "   - All smoke tests passed"
          echo "============================================"

      - name: 🧹 Tear down infrastructure
        if: always()
        working-directory: docker
        run: docker compose down -v
